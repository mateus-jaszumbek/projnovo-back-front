services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicosapp
      POSTGRES_USER: servicosapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicosapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: servicosapp-api
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: PostgreSql
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=servicosapp;Username=servicosapp;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ServicosApp.API
      Jwt__Audience: ServicosApp.Frontend
      Security__AllowedCorsOrigins__0: http://${SERVER_IP:?SERVER_IP is required}
      Security__ForceHttps: "false"
      MediaStorage__Provider: Local
      MediaStorage__LocalRootPath: /app/data/media
      MediaStorage__PublicPathPrefix: /media
      FocusWebhook__Enabled: "false"
    volumes:
      - api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    container_name: servicosapp-web
    build:
      context: ./Front-End
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_LEGAL_APP_NAME: ${VITE_LEGAL_APP_NAME:-Servicos App}
        VITE_LEGAL_APP_URL: http://${SERVER_IP}
        VITE_LEGAL_CONTROLLER_NAME: ${VITE_LEGAL_CONTROLLER_NAME:-Servicos App}
        VITE_LEGAL_CONTROLLER_DOCUMENT: ${VITE_LEGAL_CONTROLLER_DOCUMENT:-Documento sob atualizacao}
        VITE_LEGAL_SUPPORT_EMAIL: ${VITE_LEGAL_SUPPORT_EMAIL:-contato@seudominio.com}
        VITE_LEGAL_PRIVACY_EMAIL: ${VITE_LEGAL_PRIVACY_EMAIL:-privacidade@seudominio.com}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-Endereco comercial sob atualizacao}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
    name: servicosapp_postgres-data
  api-data:
    name: servicosapp_api-data
